version: 1
cases:
  - name: decimal-preservation
    family: decimals
    mode: strict
    sourceSchema:
      root:
        kind: record
        fields:
          - name: amount
            type:
              kind: decimal
              precision: 18
              scale: 2
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: amount
            type:
              kind: decimal
              precision: 18
              scale: 2
            nullable: false
    expect:
      status: ready
      mappings:
        amount: amount
      reasonKinds:
        amount: [exact-name match, exact type match]

  - name: timestamp-preservation
    family: timestamps
    mode: strict
    sourceSchema:
      root:
        kind: record
        fields:
          - name: created_at
            type:
              kind: timestamp
              unit: microsecond
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: created_at
            type:
              kind: timestamp
              unit: microsecond
            nullable: false
    expect:
      status: ready
      mappings:
        created_at: created_at

  - name: default-bearing-optional-target-is-safe-to-omit
    family: defaults
    mode: smart
    sourceSchema:
      root:
        kind: record
        fields:
          - name: id
            type: { kind: string }
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: id
            type: { kind: string }
            nullable: false
          - name: currency
            type: { kind: string }
            nullable: true
            metadata:
              default: USD
    expect:
      status: ready
      mappings:
        id: id
      omittedTargets: [currency]

  - name: enum-domain-preservation
    family: enums
    mode: strict
    sourceSchema:
      root:
        kind: record
        fields:
          - name: status
            type: { kind: string }
            nullable: false
            metadata:
              enum: [active, inactive]
    targetSchema:
      root:
        kind: record
        fields:
          - name: status
            type: { kind: string }
            nullable: false
            metadata:
              enum: [active, inactive]
    expect:
      status: ready
      mappings:
        status: status

  - name: nested-record-cannot-be-silently-flattened
    family: flatten
    mode: smart
    sourceSchema:
      root:
        kind: record
        fields:
          - name: customer
            type:
              kind: record
              fields:
                - name: name
                  type: { kind: string }
                  nullable: false
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: customer_name
            type: { kind: string }
            nullable: false
    expect:
      status: ready
      mappings:
        customer_name: customer.name
      reasonKinds:
        customer_name: [normalized-path match, exact type match]

  - name: multi-level-nested-source-to-target
    family: nested
    mode: smart
    sourceSchema:
      root:
        kind: record
        fields:
          - name: account
            type:
              kind: record
              fields:
                - name: profile
                  type:
                    kind: record
                    fields:
                      - name: city
                        type: { kind: string }
                        nullable: false
                  nullable: false
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: shipping
            type:
              kind: record
              fields:
                - name: city
                  type: { kind: string }
                  nullable: false
            nullable: false
    expect:
      status: ready
      mappings:
        shipping.city: account.profile.city
      reasonKinds:
        shipping.city: [exact-name match, exact type match]

  - name: duplicate-nested-leaf-names-remain-ambiguous
    family: adversarial/nested
    mode: smart
    sourceSchema:
      root:
        kind: record
        fields:
          - name: billing
            type:
              kind: record
              fields:
                - name: name
                  type: { kind: string }
                  nullable: false
            nullable: false
          - name: shipping
            type:
              kind: record
              fields:
                - name: name
                  type: { kind: string }
                  nullable: false
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: name
            type: { kind: string }
            nullable: false
    expect:
      status: ambiguous
      ambiguousTargets: [name]
      acceptableCandidates:
        name: [billing.name, shipping.name]
      unsafeAutoMapping: false

  - name: nested-incompatible-type-remains-unresolved
    family: adversarial/nested
    mode: smart
    sourceSchema:
      root:
        kind: record
        fields:
          - name: customer
            type:
              kind: record
              fields:
                - name: enabled
                  type: { kind: string }
                  nullable: false
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: customer_enabled
            type: { kind: bool }
            nullable: false
    expect:
      status: ambiguous
      ambiguousTargets: [customer_enabled]
      unsafeAutoMapping: false

  - name: list-record-element-normalization
    family: arrays/map
    mode: smart
    sourceSchema:
      root:
        kind: record
        fields:
          - name: customers
            type:
              kind: list
              element:
                kind: record
                fields:
                  - name: first_name
                    type: { kind: string }
                    nullable: false
              element_nullable: false
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: customers
            type:
              kind: list
              element:
                kind: record
                fields:
                  - name: firstName
                    type: { kind: string }
                    nullable: false
              element_nullable: false
            nullable: false
    expect:
      status: ready
      mappings:
        customers: customers
        customers[].firstName: customers[].first_name
      reasonKinds:
        customers: [cardinality-preserving list map]
        customers[].firstName: [normalized-name match, exact type match]

  - name: list-record-element-ambiguity-is-not-guessed
    family: adversarial/arrays
    mode: smart
    sourceSchema:
      root:
        kind: record
        fields:
          - name: customers
            type:
              kind: list
              element:
                kind: record
                fields:
                  - name: customer_id
                    type: { kind: string }
                    nullable: false
                  - name: customer-id
                    type: { kind: string }
                    nullable: false
              element_nullable: false
            nullable: false
    targetSchema:
      root:
        kind: record
        fields:
          - name: customers
            type:
              kind: list
              element:
                kind: record
                fields:
                  - name: customerId
                    type: { kind: string }
                    nullable: false
              element_nullable: false
            nullable: false
    expect:
      status: ambiguous
      ambiguousTargets: [customers]
      acceptableCandidates:
        customers: [customers]
      unsafeAutoMapping: false
