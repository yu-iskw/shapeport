# cargo-deny policy for a general-purpose Apache-2.0 Rust workspace.
#
# This is not organization-specific legal advice. Tighten the license
# allowlist in this file when a product requires a narrower policy.
# Run `cargo deny check` after any edit.
#
# Upgrade path: Dependabot updates crate versions weekly; re-run
# `cargo deny check` after lockfile changes. cargo-deny itself is
# installed by `make setup`.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[output]
feature-depth = 1

[advisories]
# Fail on vulnerabilities, unsoundness, and yanked crates.
# Scope for unmaintained-crate detection:
# workspace = only fail when a direct workspace dependency is unmaintained.
# Transitive unmaintained crates (e.g. paste via parquet) are not PR blockers.
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # Add ignored advisory IDs with a reason, for example:
    # { id = "RUSTSEC-0000-0000", reason = "no upstream fix yet; tracked in issue N" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
    "NCSA",
    "MPL-2.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Workspace members are Apache-2.0; ignore unpublished members if a
# crate later sets publish = false without a license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies may omit a version until crates are published.
# Direct crates.io dependencies must still use explicit version requirements.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
