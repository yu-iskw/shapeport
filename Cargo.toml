[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["yu-iskw"]
repository = "https://github.com/yu-iskw/rust-projet-template"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
arrow = { version = "55", default-features = false, features = ["ipc", "json"] }
arrow-array = "55"
arrow-ipc = "55"
arrow-schema = "55"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
csv = "1.3"
hex = "0.4"
http = "1"
indexmap = { version = "2", features = ["serde"] }
parquet = { version = "55", default-features = false, features = ["arrow", "snap", "flate2"] }
regex = "1"
rmcp = { version = "3.1.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yml = "0.0.12"
sha2 = "0.10"
sqlparser = "0.58"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unreachable_pub = "deny"
dead_code_pub_in_binary = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
use_self = "allow"
implicit_hasher = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
